<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCA · 预览</title>
<style>
:root{--y:#FFD400;--k:#1F1F1F;--g:#F3F3F1;--l:#E6E6E2;--m:#5B5B5B}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;color:var(--k);line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:56px 24px}
.mark{background:var(--y);display:inline-block;font-weight:800;padding:4px 14px;border-radius:6px;font-size:18px}
h1{font-size:32px;margin:18px 0 6px}
.sub{color:var(--m);font-size:14px;margin-bottom:32px}
a.card{display:block;border:1px solid var(--l);padding:20px 22px;margin-bottom:14px;text-decoration:none;color:var(--k)}
a.card:hover{border-color:var(--k)}
a.card b{display:block;font-size:18px;margin-bottom:4px}
a.card span{color:var(--m);font-size:13px}
.foot{margin-top:36px;border-top:1px solid var(--l);padding-top:14px;font-size:12px;color:var(--m)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">FUN</div>
  <h1>FCA · 页面预览</h1>
  <div class="sub">临时预览站，只放可公开页面；内部看板与客户数据不在此处。</div>

  <a class="card" href="home-draft.html">

    <b>品牌层级示意图</b>
    <span>法律主体 / FUN 母品牌 / FUN AI / FUN Certified</span>
  </a>
  <a class="card" href="progress-external.html">

  <div class="foot">临时预览 · 2026-11 · 内容以内部版本为准</div>
</div>
</body>
</html>
